name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Existing test suites
        run: npm test

      - name: Reviewer kit
        run: npm run reviewer-kit

      - name: Whitespace
        run: npm run check:whitespace

      - name: Replay verification
        run: npm run test:replay

      - name: Conformance freeze
        run: npm run test:conformance
