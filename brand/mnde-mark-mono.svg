    <path d="M538 402 H500 V622 H538" stroke="currentColor"/>
    <line x1="470" y1="512" x2="600" y2="512" stroke="currentColor"/>
    <rect x="600" y="402" width="100" height="220" stroke="currentColor"/>
    <line x1="700" y1="512" x2="864" y2="512" stroke="currentColor"/>
  </g>
</svg>
